name: Build selected reading edition

on:
  push:
    branches:
      - main
      - curated-reading-edition
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-pip python3-venv pandoc \
            texlive-xetex texlive-latex-extra texlive-fonts-recommended \
            fonts-noto-core fonts-dejavu-core poppler-utils unzip

      - name: Build and validate live edition
        run: make all

      - name: Stage live artifacts
        run: make stage

      - name: Publish validated artifacts branch
        if: github.event_name == 'push'
        env:
          BUILD_BRANCH: curated-build
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          publish_dir="$(mktemp -d)"
          cp -a dist/live/. "$publish_dir/"
          cat > "$publish_dir/BUILD.txt" <<EOF
          Source branch: ${GITHUB_REF_NAME}
          Source commit: ${GITHUB_SHA}
          Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          Built at (UTC): $(date -u +'%Y-%m-%dT%H:%M:%SZ')
          EOF

          cd "$publish_dir"
          git init
          git checkout -b "$BUILD_BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Build selected essays from ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin "$BUILD_BRANCH"

      - name: Upload validated EPUB and PDF artifacts
        uses: actions/upload-artifact@v4
        with:
          name: paul-graham-selected-edition
          path: dist/
          if-no-files-found: error
          retention-days: 30

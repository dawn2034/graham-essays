name: Build and release selected reading edition

permissions:
  contents: write

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ci.yml'
      - 'sample/**'
      - 'scripts/**'
      - 'Makefile'
      - 'graham.py'
      - 'selection.json'
      - 'theme-volumes.json'
      - 'metadata.yaml'
      - 'print-metadata-*.yaml'
      - 'print-header.tex'
      - 'print-cover.tex'
      - 'epub.css'
      - 'requirements.txt'
      - 'cover.svg'
      - 'vol_1.png'
      - 'vol_2.png'
      - 'vol_3.png'
      - 'paul-graham-three-volume-spines-final.PNG'
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

concurrency:
  group: selected-edition-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-venv pandoc \
            texlive-xetex texlive-latex-extra texlive-fonts-recommended \
            fonts-noto-core fonts-dejavu-core poppler-utils unzip librsvg2-bin

      - name: Cache Python packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-

      - name: Build and validate live edition
        run: make all

      - name: Build synthetic typography proofs
        run: make sample

      - name: Stage release and review artifacts
        id: release_meta
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/release dist/review

          cp graham.epub dist/release/Paul-Graham-Selected-Essays.epub
          cp graham-a5.pdf dist/release/Paul-Graham-Selected-Essays-A5.pdf
          cp graham-b5.pdf dist/release/Paul-Graham-Selected-Essays-B5.pdf
          cp graham-a4.pdf dist/release/Paul-Graham-Selected-Essays-A4.pdf
          cp graham-b5-vol1.pdf dist/release/Paul-Graham-Selected-Essays-B5-Vol-1.pdf
          cp graham-b5-vol2.pdf dist/release/Paul-Graham-Selected-Essays-B5-Vol-2.pdf
          cp graham-b5-vol3.pdf dist/release/Paul-Graham-Selected-Essays-B5-Vol-3.pdf
          cp vol_1.png dist/release/Paul-Graham-Selected-Essays-B5-Vol-1-Cover.png
          cp vol_2.png dist/release/Paul-Graham-Selected-Essays-B5-Vol-2-Cover.png
          cp vol_3.png dist/release/Paul-Graham-Selected-Essays-B5-Vol-3-Cover.png
          cp paul-graham-three-volume-spines-final.PNG dist/release/Paul-Graham-Three-Volume-Spines-Final.PNG
          cp essays.csv excluded_essays.csv selection.json theme-volumes.json build_summary.json dist/release/
          cp dist/theme-volumes/theme-volume-plan.json dist/theme-volumes/theme-volume-summary.json dist/release/

          for pdf in graham-a5.pdf graham-b5.pdf graham-a4.pdf graham-b5-vol1.pdf graham-b5-vol2.pdf graham-b5-vol3.pdf; do
            base=$(basename "$pdf" .pdf)
            pdfinfo "$pdf" > "dist/review/pdfinfo-${base}.txt"
            pdffonts "$pdf" > "dist/review/pdffonts-${base}.txt"
          done

          (
            cd dist/release
            sha256sum * > SHA256SUMS.txt
          )

          python3 - <<'PY'
          import datetime
          import json
          import os
          from pathlib import Path

          build = json.loads(Path('build_summary.json').read_text(encoding='utf-8'))
          themes = json.loads(Path('dist/theme-volumes/theme-volume-summary.json').read_text(encoding='utf-8'))
          date = datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%d')
          short_sha = os.environ['GITHUB_SHA'][:8]
          tag = f'themed-selected-{date}-{short_sha}'
          name = f'Paul Graham: Selected Essays — Themed Three-Volume Edition ({date})'
          lines = [
              "A live selected build from Paul Graham's official essay index.",
              '',
              f"- Included essays: {build['included_count']}",
              f"- Excluded essays: {build['excluded_count']}",
              f"- Source-index entries: {build['source_index_count']}",
              '- Single-volume formats: EPUB 3, A5 PDF, ISO B5 PDF, A4 PDF',
              '- Themed print set: three independent ISO B5 volumes with dedicated cover artwork',
              '- Final print spine artwork: Paul-Graham-Three-Volume-Spines-Final.PNG',
              '',
          ]
          for volume in themes['volumes']:
              lines.append(
                  f"- {volume['label']} — {volume['subtitle']}: "
                  f"{volume['essay_count']} essays, {volume['page_count']} pages"
              )
          lines.extend([
              '',
              f"Source commit: `{os.environ['GITHUB_SHA']}`",
              '',
              '`selection.json` records the exclusion boundary; `theme-volumes.json` and `theme-volume-plan.json` make the thematic classification auditable.'
          ])
          body = '\n'.join(lines)
          with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as handle:
              handle.write(f'tag={tag}\n')
              handle.write(f'name={name}\n')
              handle.write('body<<EOF\n')
              handle.write(body + '\n')
              handle.write('EOF\n')
          PY

      - name: Upload complete build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: paul-graham-selected-edition-${{ github.sha }}
          path: dist/
          retention-days: 30
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: ${{ steps.release_meta.outputs.name }}
          body: ${{ steps.release_meta.outputs.body }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            dist/release/*

name: Build selected reading edition

on:
  push:
    branches:
      - main
      - curated-reading-edition
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-pip python3-venv pandoc \
            texlive-xetex texlive-latex-extra texlive-fonts-recommended \
            fonts-noto-core fonts-dejavu-core poppler-utils unzip

      - name: Build and validate live edition
        run: make all

      - name: Stage live artifacts
        run: make stage

      - name: Upload validated EPUB and PDF artifacts
        uses: actions/upload-artifact@v4
        with:
          name: paul-graham-selected-edition
          path: dist/
          if-no-files-found: error
          retention-days: 30
